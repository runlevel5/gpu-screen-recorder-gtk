[package]
name = "gpu-screen-recorder-gtk"
type = "executable"
version = "3.8.0"
platforms = ["posix"]

[config]
ignore_dirs = ["build"]
error_on_warning = "true"

[dependencies]
gtk+-3.0 = "3"
x11 = "1"
xrandr = "1"
libpulse = ">=13"
libdrm = ">=2"
wayland-egl = ">=15"
wayland-client = ">=1"
ayatana-appindicator3-0.1 = ">=0"
